name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: SomeshwarDeore
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=lime&color_empty=black
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=lime

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
